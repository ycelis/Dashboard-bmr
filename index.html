<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSP: solo scripts propios (incluye pptxgen.bundle.js local); conexiones solo a Monday y al corrector.
     Si usas un corrector LanguageTool propio, agrega su dominio en connect-src. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://api.monday.com https://api.languagetool.org; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>BMR · Business Monthly Review</title>
<script src="pptxgen.bundle.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0b2a4a;--blue:#0f62fe;--green:#198038;--amber:#f1a52b;--red:#da1e28;--bg:#f4f6f9;--bd:#e5e7eb;--mut:#57606a;--tx:#1f2328}
body{background:var(--bg);font-family:-apple-system,"Segoe UI",system-ui,sans-serif;font-size:14px;color:var(--tx);line-height:1.5}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
header h1{font-size:18px;font-weight:600;flex:1;min-width:220px}
header h1 small{display:block;font-size:12px;font-weight:400;opacity:.75}
select,button,input,textarea{font-family:inherit;font-size:13px}
select,input.txt{padding:6px 8px;border:1px solid #c6ccd3;border-radius:6px;background:#fff;color:var(--tx)}
button{padding:7px 14px;border:1px solid transparent;border-radius:6px;cursor:pointer;background:var(--blue);color:#fff;font-weight:600}
button.sec{background:#fff;color:var(--navy);border-color:#c6ccd3}
button.tab{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
button.tab.on{background:#fff;color:var(--navy)}
#status-line{font-size:12px;opacity:.8}
main{padding:20px 24px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{font-size:12px;color:var(--mut)}
.grp-title{font-size:15px;font-weight:700;color:var(--navy);margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px;border-left:5px solid var(--amber)}
.card.Done{border-left-color:var(--green)}.card.Stuck{border-left-color:var(--red)}
.card-h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.card-h h3{font-size:15px;flex:1}
.card-h small{color:var(--mut);font-size:11px}
.saved{font-size:11px;min-width:60px;text-align:right}
.saved.ok{color:var(--green)}.saved.err{color:var(--red)}.saved.wip{color:var(--amber)}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--blue);margin:8px 0 2px}
textarea{width:100%;min-height:62px;padding:6px 8px;border:1px solid #d0d7de;border-radius:6px;resize:vertical;line-height:1.45}
textarea:focus,select:focus,input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.row{display:flex;gap:8px;align-items:center}
.row input.txt{width:110px}
.lbl{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:space-between;margin:8px 0 2px}
.lbl button{white-space:nowrap}
.lbl label{margin:0}
button.chk{padding:2px 9px;font-size:11px;background:#fff;color:var(--blue);border-color:var(--blue)}
button.chk:disabled{opacity:.6;cursor:wait}
.sp{margin-top:4px;font-size:12px}
.trv{margin-top:4px;padding:6px 8px;background:#f1f6ff;border-left:3px solid var(--blue);border-radius:4px;font-size:12px;color:var(--mut);white-space:pre-wrap}
.trv:empty{display:none}
.sp .ok{color:var(--green);font-weight:600}.sp .bad{color:var(--red)}
.sp-i{background:#fffbeb;border:1px solid #f5dfa0;border-radius:6px;padding:6px 8px;margin-top:4px}
.sp-i mark{background:#ffe08a;padding:0 2px;border-radius:2px}
.sp-i small{display:block;color:var(--mut);margin:2px 0 4px}
.sp-i button,.sp-all{padding:2px 8px;font-size:11px;margin-right:4px;background:var(--green)}
.sp-all{margin-top:6px}
.lbl .btns{display:flex;gap:6px}
button.lum{padding:2px 9px;font-size:11px;background:#fff;color:var(--purple,#7c5cd8);border-color:#7c5cd8}
.mbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.mbar b{font-size:15px;color:var(--navy);flex:1;min-width:200px}
.mbar input.txt{min-width:260px}
.mhide{font-size:12px;display:flex;gap:4px;align-items:center;margin:0;text-transform:none;letter-spacing:0;color:var(--mut);font-weight:400}
.mboard{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;align-items:start}
.mcol{background:#eef1f5;border-radius:8px;padding:8px}
.mcol h4{font-size:13px;color:var(--navy);margin:2px 4px 8px;display:flex;justify-content:space-between}
.mcol h4 i{font-style:normal;color:var(--mut);font-weight:400}
.mempty{color:#8d949c;text-align:center;font-size:12px}
.mcard{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px}
.mname{font-weight:600;margin-bottom:4px;word-break:break-word}
.mmeta{font-size:11px;color:var(--mut);margin-bottom:6px}
.mtag{background:#e8f0fe;color:var(--blue);border-radius:4px;padding:1px 6px;margin-right:6px}
.mcard select{width:100%;margin-bottom:6px}
.mcard textarea{min-height:44px}
.mcard .saved{display:block;text-align:right;min-height:14px}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
.kpi.red b{color:var(--red)}.kpi.amb b{color:#b7791f}.kpi.grn b{color:var(--green)}
.malerts{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.malerts h4{font-size:14px;color:var(--navy);margin-bottom:8px}
.ma{border-left:4px solid var(--bd);padding:4px 10px;margin-bottom:8px}
.ma.red{border-left-color:var(--red)}.ma.amb{border-left-color:var(--amber)}.ma.gry{border-left-color:#8d949c}.ma.grn{border-left-color:var(--green)}.ma small{color:var(--mut)}
.ma h5{font-size:12px;margin-bottom:2px}
.ma ul{margin-left:18px;font-size:13px}
.mok{color:var(--green);font-weight:600}
.mhint{color:var(--mut);font-size:12px;margin-top:6px}
.mwed{background:#fff8e1;border:1px solid #f5dfa0;border-radius:6px;padding:8px 10px;margin-bottom:10px;font-weight:600;color:#7a5a00}
.mhist{margin-top:6px;font-size:12px}
.mh{border-top:1px solid var(--bd);padding:4px 0;white-space:pre-wrap;word-break:break-word;color:var(--mut)}
.mh b{color:var(--tx)}
.mcard.over{border-left:4px solid var(--red)}.mcard.soon{border-left:4px solid var(--amber)}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;max-width:560px;z-index:50}
/* Configuración */
#cfg{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:24px}
#cfg h2{margin-bottom:6px}#cfg p{color:var(--mut);font-size:13px;margin-bottom:12px}
#cfg input.txt,#cfg select.txt{width:100%;margin-bottom:10px}
#msg{margin:12px 0;padding:10px 12px;border-radius:6px;background:#fff1f1;color:var(--red);border:1px solid #ffd7d9;display:none;font-size:13px}
/* Diapositiva */
.slide-wrap{width:100%;overflow:hidden;margin-bottom:18px}
#slide-bar{display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.slide{width:1280px;height:720px;background:#fff;transform-origin:top left;border:1px solid var(--bd);display:flex;flex-direction:column}
.slide .top{background:#fff;padding:10px 20px;display:flex;align-items:baseline;gap:14px;border-bottom:3px solid var(--navy)}
.slide .top h2{font-size:26px;color:var(--navy)}.slide .top span{color:var(--mut);font-size:15px}
.slide .top .logos{margin-left:auto;display:flex;align-items:center;gap:18px;align-self:center}
.slide .top .logos img{display:block}
.slide .cols{flex:1;display:grid;grid-template-columns:repeat(4,1fr);min-height:0}
.kp{display:flex;gap:12px;padding:12px 20px}
.kp div{flex:1;background:#f7f8fa;border:1px solid var(--bd);padding:6px 14px}
.kp b{display:block;font-size:30px;line-height:1.2;color:var(--navy)}.kp span{font-size:13px;color:var(--mut)}
.charts{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;padding:0 20px 16px;min-height:0}
.cp{border:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.cp h5{background:var(--navy);color:#fff;font-size:15px;padding:6px 12px;font-weight:600}
.cp svg{flex:1;min-height:0;width:100%}
.scol{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--bd)}
.scol:last-child{border-right:0}
.scol h4{background:var(--navy);color:#fff;font-size:20px;padding:10px 14px;font-weight:600}
.scol h4 i{font-style:normal;color:#78a9ff;margin-right:8px}
.sbody{flex:1;padding:10px 14px;overflow:hidden;font-size:15px;line-height:1.3}
.sg{font-size:.8em;font-weight:700;color:var(--blue);text-transform:uppercase;margin:8px 0 3px}
.sg:first-child{margin-top:0}
.si{margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.si b{display:block;font-weight:700}
.si p{white-space:pre-wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--amber)}
.dot.Done{background:var(--green)}.dot.Stuck{background:var(--red)}
.hide{display:none!important}
@media print{header,#slide-bar,.noprint{display:none!important}body{background:#fff}main{padding:0}.slide{transform:none!important;border:0}.slide-wrap{height:auto!important;margin:0;page-break-after:always}@page{size:1280px 720px;margin:0}}
</style>
</head>
<body>

<header class="noprint">
  <h1>BMR · Business Monthly Review<small id="board-name">—</small></h1>
  <select id="f-mes" title="Mes"></select>
  <button class="tab on" data-v="edit" data-i18n="tab_edit">Captura</button>
  <button class="tab" data-v="slide" data-i18n="tab_slide">Diapositiva gerencial</button>
  <button class="tab" data-v="meet"><span data-i18n="tab_meet">Reuniones</span> <b id="m-badge" class="badge hide"></b></button>
  <button class="sec" id="b-refresh" data-i18n="refresh">Actualizar</button>
  <button class="sec" id="b-cfg" data-i18n="settings">Configuración</button>
  <button class="sec" id="b-lang" title="Español / English">EN</button>
  <button class="sec hide" id="b-tr" data-i18n="tr_btn">🌐 Activar traducción</button>
  <span id="status-line"></span>
</header>

<main>
  <div id="msg"></div>

  <section id="cfg" class="hide">
    <h2 data-i18n="cfg_h">Conexión con Monday</h2>
    <p data-i18n="cfg_p">Usa tu token personal de Monday (Avatar → Developers → My access tokens). Se guarda solo en este navegador y respeta tus permisos sobre el tablero.</p>
    <input class="txt" id="c-token" type="password" placeholder="Token de Monday" data-i18n-ph="cfg_token">
    <input class="txt" id="c-board" placeholder="Board ID" value="18439845138">
    <input class="txt" id="c-meet" placeholder="Board ID de Reuniones (Managers Meeting)" data-i18n-ph="cfg_meet">
    <input class="txt" id="c-lt" placeholder="URL del corrector (LanguageTool)" data-i18n-ph="cfg_lt">
    <label for="c-ai" class="lbl" data-i18n="cfg_ai">Asistente de redacción</label>
    <select id="c-ai" class="txt">
      <option value="copy" data-i18n="ai_copy">Solo copiar el prompt (sin abrir ninguna página)</option>
      <option value="ica" data-i18n="ai_ica">Asistente de redacción ICA (IBM)</option>
      <option value="copilot" data-i18n="ai_copilot">Microsoft Copilot</option>
      <option value="custom" data-i18n="ai_custom">Otro enlace (URL propia)</option>
    </select>
    <input class="txt" id="c-ai-url" placeholder="URL de tu asistente" data-i18n-ph="cfg_ai_url">
    <button id="c-save" data-i18n="cfg_save">Guardar y conectar</button>
  </section>

  <section id="v-edit" class="hide">
    <div class="kpis" id="kpis"></div>
    <div id="groups"></div>
  </section>

  <section id="v-meet" class="hide">
    <div class="mbar noprint">
      <b id="m-name"></b>
      <label class="mhide"><input type="checkbox" id="m-hide" checked> <span data-i18n="m_hide">Ocultar los hechos</span></label>
      <input class="txt" id="m-new" placeholder="Nuevo tema, acuerdo o pendiente" data-i18n-ph="m_new" maxlength="200">
      <button id="m-add" data-i18n="m_add">Agregar</button>
      <button class="sec" id="m-copy" data-i18n="m_copy">Copiar resumen</button>
      <button class="sec" id="m-ics" data-i18n="m_ics">Recordatorio semanal</button>
      <button id="m-close" data-i18n="m_close">Cerrar reunión</button>
    </div>
    <div class="kpis" id="m-kpis"></div>
    <div class="malerts" id="m-alerts"></div>
    <div class="malerts" id="m-prev"></div>
    <div id="m-board" class="mboard"></div>
  </section>

  <section id="v-slide" class="hide">
    <div id="slide-bar" class="noprint">
      <button id="b-pptx" data-i18n="pptx">Descargar PowerPoint</button>
      <button class="sec" id="b-print" data-i18n="print">Imprimir / PDF</button>
      <span style="color:var(--mut);font-size:12px" data-i18n="hint">Las diapositivas se arman solas con lo que los gerentes capturan en la pestaña Captura.</span>
    </div>
    <div class="slide-wrap"><div class="slide" id="slide"></div></div>
    <div class="slide-wrap"><div class="slide" id="slide2"></div></div>
  </section>
</main>

let LANG = localStorage.getItem("bmr_lang") === "en" ? "en" : "es";
const t = k => I18N[LANG][k] || k;
const fm = m => LANG === "en" ? (MESES_EN[MESES.indexOf(m)] || m) : m;       // nombre de mes visible

// Traducción visual del contenido, en ambos sentidos (ES ⇄ EN). Se detecta el idioma de cada texto
// y solo se traduce si es distinto al idioma activo de la interfaz.
const TR_CACHE = {};
const trPromises = {};
let detPromise = null, trWarned = false;
// El navegador descarga el paquete de idioma solo si se lo pide un clic del usuario (botón "Activar traducción").
// Si ya está descargado (availability "available") se crea sin clic. Solo se guardan los traductores que sí se crearon.
const trPair = () => LANG === "es" ? ["en", "es"] : ["es", "en"]; // idioma del texto → idioma de la interfaz
const userActive = () => !navigator.userActivation || navigator.userActivation.isActive;
async function getTranslator(src, tgt, monitor) {
  const k = src + ">" + tgt;
  if (trPromises[k]) return trPromises[k];
  if (typeof Translator === "undefined") return null;
  try {
    const av = await Translator.availability({ sourceLanguage: src, targetLanguage: tgt });
    if (av === "unavailable" || (av !== "available" && !userActive())) return null;
    const tr = await Translator.create({ sourceLanguage: src, targetLanguage: tgt, monitor });
    trPromises[k] = tr;
    return tr;
  } catch (e) { console.warn("[Traducción]", e.message); return null; }
}
async function getDetector() { // opcional: si no se puede crear, hay heurística de respaldo
  if (!detPromise) {
    detPromise = (async () => {
      try {
        if (typeof LanguageDetector === "undefined") return null;
        const av = await LanguageDetector.availability();
        if (av === "unavailable" || (av !== "available" && !userActive())) return null;
        return await LanguageDetector.create();
      } catch (e) { return null; }
    })();
  }
  const d = await detPromise;
  if (!d) detPromise = null; // reintenta más adelante (puede haberse descargado mientras tanto)
  return d;
}
function updateTrBtn(show) { // muestra el botón si falta preparar el idioma; lo oculta cuando ya está listo
  const [s, g] = trPair();
  $("b-tr").classList.toggle("hide", !show || !!trPromises[s + ">" + g]);
}
const EN_WORDS = /\b(the|and|of|to|is|are|was|were|with|for|in|on|by|from|that|this|has|have|will|been|not|we|our|new|all|due|per)\b/gi;
const ES_WORDS = /\b(el|la|los|las|de|del|y|en|que|por|para|con|se|un|una|es|son|fue|al|su|sus|no|más|como|ya)\b|[áéíóúñ¿¡]/gi;
async function detectLang(s) {
  const det = await getDetector();
  if (det) {
    try {
      const r = (await det.detect(s))[0];
      if (r && r.confidence >= 0.6 && (r.detectedLanguage === "es" || r.detectedLanguage === "en")) return r.detectedLanguage;
    } catch (e) { /* usa la heurística */ }
  }
  const en = (s.match(EN_WORDS) || []).length, es = (s.match(ES_WORDS) || []).length;
  return en > es ? "en" : "es";
}
const tx = s => TR_CACHE[LANG + "|" + s] || s;
async function prepTranslations(texts) {
  const todo = [...new Set(texts)].filter(s => s && s.trim() && !((LANG + "|" + s) in TR_CACHE));
  if (!todo.length) return false;
  let changed = false;
  for (const s of todo) {
    const key = LANG + "|" + s;
    const src = await detectLang(s);
    if (src === LANG) { TR_CACHE[key] = s; continue; }
    const tr = await getTranslator(src, LANG);
    if (!tr) { // sin traductor: no se guarda en la caché; el botón "Activar traducción" lo prepara
      if (!trWarned) {
        trWarned = true;
        if (typeof Translator === "undefined") alert(t("e_tr")); else toast(t("e_tr_click"));
      }
      updateTrBtn(true);
      return changed;
    }
    try { TR_CACHE[key] = await tr.translate(s); changed = changed || TR_CACHE[key] !== s; } catch (e) { TR_CACHE[key] = s; }
  }
  return changed;
}

async function gql(query, variables) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": token(), "API-Version": "2024-01" },
    body: JSON.stringify({ query, variables })
  });
  if (!res.ok) throw new Error("Monday respondió HTTP " + res.status);
  const json = await res.json();
  if (json.errors && json.errors.length) throw new Error(json.errors[0].message);
  return json.data;
}

async function load(silent) {
  if (!token()) { showConfig(); return; }
  try {
    const data = await gql(`query($id:[ID!]){boards(ids:$id){name groups{id title}
      items_page(limit:500){items{id name group{id title} column_values{id text column{title type}}}}}}`, { id: [boardId()] });
    const b = data.boards && data.boards[0];
    if (!b) throw new Error("Tablero no encontrado o sin acceso.");
    const colIds = {};
    const items = b.items_page.items.map(it => {
      const o = { id: it.id, name: it.name, gid: it.group.id, status: "", mes: "", person: "", hi: "", ch: "", or: "", sol: "", nums: {} };
      it.column_values.forEach(cv => {
        const t = (cv.column.title || "").trim().toLowerCase();
        const set = (k, v) => { o[k] = v || ""; colIds[k] = cv.id; };
        if (cv.column.type === "numbers") { const n = parseFloat((cv.text || "").replace(/,/g, "")); if (!isNaN(n)) o.nums[cv.column.title.trim()] = n; }
        else if (t === "status") set("status", cv.text);
        else if (t === "mes") set("mes", cv.text);
        else if (t === "person") set("person", cv.text);
        else FIELDS.forEach(f => { if (t === f.title.toLowerCase()) set(f.key, cv.text); });
      });
      return o;
    });
    const sig = JSON.stringify([b.name, items]);
    if (silent && sig === state.sig) { setStatus("nochg"); return; }
    state = { boardName: b.name, groups: b.groups, items, colIds, sig };
    showMsg("");
    $("board-name").textContent = t("board") + b.name;
    buildMonthFilter();
    render();
    setStatus("upd");
  } catch (e) {
    showMsg(t("e_read") + e.message);
    if (!state.items.length) showConfig();
  }
}

const MEET_DEFAULT = "18441411063";

const meet = { name: "", cols: {}, labels: [], items: [], sig: "", loaded: false, hist: {}, histLoaded: false, histErr: false };
const MEET_COLS = { status: "status", date: "date", person: "person", notes: "long_text", tipo: "dropdown" };

async function meetLoad(silent) {
  if (!token()) { showConfig(); return; }
  try {
    const data = await gql(`query($id:[ID!]){boards(ids:$id){name
      columns{id title type settings_str}
      items_page(limit:500){items{id name updated_at column_values{id text type value}}}}}`, { id: [meetId()] });
    const b = data.boards && data.boards[0];
    if (!b) throw new Error(t("m_noboard"));
    const cols = {};
    b.columns.forEach(c => { // la primera columna de cada tipo es la que se usa
      Object.keys(MEET_COLS).forEach(k => { if (!cols[k] && c.type === MEET_COLS[k]) cols[k] = c.id; });
    });
    const pref = b.columns.find(c => c.type === "date" && /compromiso|due|l[ií]mite|vence|deadline|entrega/i.test(c.title || ""));
    if (pref) cols.date = pref.id;
    let labels = [];
    if (cols.status) {
      const st = b.columns.find(c => c.id === cols.status);
      try {
        const s = JSON.parse(st.settings_str || "{}").labels || {};
        labels = Object.keys(s).map(i => s[i]).filter(Boolean);
      } catch (e) { labels = []; }
    }
    const items = b.items_page.items.map(it => {
      const g = id => (it.column_values.find(c => c.id === id) || {}).text || "";
      return { id: it.id, name: it.name, upd: it.updated_at || "", status: g(cols.status), date: g(cols.date), person: g(cols.person), notes: g(cols.notes), tipo: g(cols.tipo) };
    });
    const sig = JSON.stringify([b.name, items]);
    if (silent && sig === meet.sig) return;
    Object.assign(meet, { name: b.name, cols, labels, items, sig, loaded: true });
    if (view === "meet") showMsg("");
    renderMeet();
    if (!silent || !meet.histLoaded) meetHistLoad();
  } catch (e) {
    if (!silent) showMsg(t("e_read") + e.message);
  }
}

// ── Análisis ejecutivo y alertas para la próxima reunión ─────────────────────
const todayMid = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
function meetDays(i) { // días hasta la fecha compromiso (negativo = vencido); null si no hay fecha
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(i.date || "");
  return m ? Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - todayMid()) / 864e5) : null;
}
const byDate = (a, b) => { const x = meetDays(a), y = meetDays(b); return (x === null) - (y === null) || (x || 0) - (y || 0); };
const isStuck = s => /stuck|bloquead|atascad/i.test(s || "");
function meetAnalysis() {
  const open = meet.items.filter(i => !isDone(i.status));
  const old = Date.now() - 14 * 864e5;
  return {
    open, done: meet.items.length - open.length,
    over: open.filter(i => { const d = meetDays(i); return d !== null && d < 0; }),
    soon: open.filter(i => { const d = meetDays(i); return d !== null && d >= 0 && d <= 7; }),
    stuck: open.filter(i => isStuck(i.status)),
    noOwner: open.filter(i => !i.person),
    noDate: meet.cols.date ? open.filter(i => meetDays(i) === null) : [],
    stale: open.filter(i => i.upd && new Date(i.upd).getTime() < old)
  };
}
const ALERT_GROUPS = [["over", "m_a_over", "red"], ["soon", "m_a_soon", "amb"], ["stuck", "m_a_stuck", "red"],
  ["noOwner", "m_a_noown", "amb"], ["noDate", "m_a_nodate", "gry"], ["stale", "m_a_stale", "gry"]];
function meetLine(i) {

  const when = d === null ? "" : d < 0 ? t("m_late").replace("{n}", -d) : d === 0 ? t("m_today") : t("m_in").replace("{n}", d);
  return [i.name, i.person, i.date && (i.date.slice(0, 10) + (when ? " (" + when + ")" : ""))].filter(Boolean).join(" · ");
}
const MEET_DAY = 3; // miércoles (0 = domingo)

function meetSummary() {
  const a = meetAnalysis();
  const out = [t("m_sum_h") + " — " + meet.name + " — " + new Date().toLocaleDateString(LANG === "en" ? "en-US" : "es-CO"),
    [["m_k_open", a.open], ["m_k_over", a.over], ["m_k_soon", a.soon], ["m_k_stuck", a.stuck]].map(k => t(k[0]) + ": " + k[1].length).join(" | ")];

// Historial: cada "Cerrar reunión" deja en Monday una nota "[BMR-REU fecha] ..." en cada pendiente abierto.
// Aquí se leen esas notas para mostrar qué quedó pendiente de la reunión anterior. Es opcional: si falla, no rompe el tablero.
const REU = /\[BMR-REU (\d{4}-\d{2}-\d{2})\]\s*/;
async function meetHistLoad() {
  const cut = Date.now() - 45 * 864e5;
  const ids = meet.items.filter(i => !isDone(i.status) || !i.upd || new Date(i.upd).getTime() > cut).map(i => i.id);
  const hist = {};
  try {
    for (let k = 0; k < ids.length; k += 50) {
      const d = await gql(`query($i:[ID!]){items(ids:$i){id updates(limit:5){text_body created_at}}}`, { i: ids.slice(k, k + 50) });
      (d.items || []).forEach(it => (it.updates || []).forEach(u => {
        const m = REU.exec(u.text_body || "");
        if (m && (!hist[it.id] || m[1] > hist[it.id].date)) hist[it.id] = { date: m[1], text: (u.text_body || "").replace(REU, "").trim() };
      }));
    }
    Object.assign(meet, { hist, histLoaded: true, histErr: false });
  } catch (e) { meet.histErr = true; }
  if (view === "meet") renderPrev();
}
function prevMeeting() {
  const dates = Object.keys(meet.hist).map(k => meet.hist[k].date).sort();
  if (!dates.length) return null;
  const last = dates[dates.length - 1], h = i => meet.hist[i.id];
  return {
    date: last,
    still: meet.items.filter(i => h(i) && !isDone(i.status)),
    solved: meet.items.filter(i => h(i) && h(i).date === last && isDone(i.status)),
    fresh: meet.items.filter(i => !h(i) && !isDone(i.status))
  };
}
function renderPrev() {
  const box = $("m-prev"), head = `<h4>${t("m_prev")}</h4>`;
  if (meet.histErr) { box.innerHTML = head + `<p class="mhint">${t("m_prev_err")}</p>`; return; }
  if (!meet.histLoaded) { box.innerHTML = head + `<p class="mhint">${t("m_hist_load")}</p>`; return; }
  const p = prevMeeting();
  if (!p) { box.innerHTML = head + `<p class="mhint">${t("m_prev_none")}</p>`; return; }
  const note = i => { const x = meet.hist[i.id].text; return x.length > 170 ? x.slice(0, 170) + "…" : x; };
  const sec = (cls, title, list, fn) => list.length ? `<div class="ma ${cls}"><h5>${t(title)} · ${list.length}</h5><ul>${list.slice(0, 10).map(fn).join("")}${list.length > 10 ? `<li>${t("m_more").replace("{n}", list.length - 10)}</li>` : ""}</ul></div>` : "";

    sec("amb", "m_prev_still", p.still, i => `<li>${esc(meetLine(i))}${meet.hist[i.id].date !== p.date ? ` <small>(${esc(meet.hist[i.id].date)})</small>` : ""}<br><small>${esc(note(i))}</small></li>`) +
    sec("grn", "m_prev_solved", p.solved, i => `<li>${esc(i.name)}</li>`) +
    sec("gry", "m_prev_new", p.fresh, i => `<li>${esc(meetLine(i))}</li>`) +
    (p.still.length || p.solved.length || p.fresh.length ? "" : `<p class="mok">${t("m_ok")}</p>`);
}

// Cerrar reunión: deja una nota en cada pendiente abierto (queda en el historial del elemento en Monday).
async function meetClose() {
  const open = meet.items.filter(i => !isDone(i.status));
  if (!open.length) return toast(t("m_close_none"));
  if (!confirm(t("m_close_c").replace("{n}", open.length))) return;
  const btn = $("m-close"); btn.disabled = true;
  const hoy = new Date().toLocaleDateString(LANG === "en" ? "en-US" : "es-CO");
  const iso = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  let n = 0;
  try {
    for (const i of open) {
      const body = "[BMR-REU " + iso + "] " + t("m_note_h") + " " + hoy + ": " + (i.status || t("m_none")) + (i.person ? " · " + i.person : "") +
        (i.date ? " · " + t("m_due") + " " + i.date.slice(0, 10) : "") + (i.notes ? "\n" + t("m_notes") + ": " + i.notes : "");
      await gql(`mutation($i:ID!,$b:String!){create_update(item_id:$i,body:$b){id}}`, { i: i.id, b: body });
      n++;
    }
    toast(t("m_close_ok").replace("{n}", n));
    await meetLoad(false);
  } catch (e) { showMsg(t("e_save") + e.message + " (" + n + "/" + open.length + ")"); }
  finally { btn.disabled = false; }
}

// Recordatorio semanal para el calendario (.ics): cada miércoles, con alarma 15 min antes.
function icsText() {
  const d = new Date(); d.setHours(10, 0, 0, 0);
  d.setDate(d.getDate() + ((MEET_DAY - d.getDay() + 7) % 7));
  const p2 = n => String(n).padStart(2, "0");
  const f = x => x.getFullYear() + p2(x.getMonth() + 1) + p2(x.getDate()) + "T" + p2(x.getHours()) + p2(x.getMinutes()) + "00";
  const end = new Date(d.getTime() + 36e5);
  const esc2 = s => String(s).replace(/[\\;,]/g, "\\$&").replace(/\n/g, "\\n");
  const url = /^https?:/.test(location.href) ? location.href.split("#")[0] : "";
  const desc = t("m_ics_desc") + (url ? "\n" + url : "");
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//BMR//Reuniones//ES", "BEGIN:VEVENT",
    "UID:bmr-reunion-miercoles@dashboard", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""),
    "DTSTART:" + f(d), "DTEND:" + f(end), "RRULE:FREQ=WEEKLY;BYDAY=WE",
    "SUMMARY:" + esc2(t("m_ics_title")), "DESCRIPTION:" + esc2(desc), url ? "URL:" + url : "",
    "BEGIN:VALARM", "TRIGGER:-PT15M", "ACTION:DISPLAY", "DESCRIPTION:" + esc2(t("m_ics_title")), "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n");
}
function meetIcs() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([icsText()], { type: "text/calendar" }));
  a.download = "reunion-miercoles.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(t("m_ics_ok"));
}

// ── Revisión de ortografía y gramática (LanguageTool) ────────────────────────
// Detecta ES/EN automáticamente. Las correcciones se aplican al campo y se guardan
// en Monday por el mismo flujo de autoguardado (evento "change").
const LT_DEFAULT = "https://api.languagetool.org/v2/check";
const ltUrl = () => (localStorage.getItem("bmr_lt") || "").trim() || LT_DEFAULT;
const SP = {}; // "itemId|campo" → { text, matches }

async function ltCheck(text) {
  const res = await fetch(ltUrl(), {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded", "Accept": "application/json" },
    body: new URLSearchParams({ text, language: "auto", preferredVariants: "es-ES,en-US" })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return (await res.json()).matches || [];
}

function paintSpell(cardEl, key, box) {
  const id = cardEl.dataset.id + "|" + key, { text, matches } = SP[id];
  if (!matches.length) { box.innerHTML = `<span class="ok">${t("sp_ok")}</span>`; return; }
  box.innerHTML = matches.map((m, n) => `<div class="sp-i">
      <mark>${esc(text.substr(m.offset, m.length) || "␣")}</mark> — ${esc(m.message)}
      ${m.replacements.length ? `<small>${m.replacements.slice(0, 3).map((r, k) => `<button data-ap="${n}" data-r="${k}">${t("sp_apply")}: ${esc(r.value)}</button>`).join("")}</small>` : ""}
    </div>`).join("") +
    (matches.some(m => m.replacements.length) ? `<button class="sp-all" data-apall="1">${t("sp_all")}</button>` : "");
}

async function spellRun(cardEl, key) {
  const ta = cardEl.querySelector(`textarea[data-k="${key}"]`), box = cardEl.querySelector(`[data-sp="${key}"]`);
  const btn = cardEl.querySelector(`[data-chk="${key}"]`), text = ta.value;
  if (!text.trim()) { box.innerHTML = `<span class="bad">${t("sp_empty")}</span>`; return; }
  if (!localStorage.getItem("bmr_sp_ok")) {
    if (!confirm(t("sp_consent"))) return;
    localStorage.setItem("bmr_sp_ok", "1");
  }
  btn.disabled = true; btn.textContent = t("sp_run");
  try {
    SP[cardEl.dataset.id + "|" + key] = { text, matches: await ltCheck(text) };
    paintSpell(cardEl, key, box);
  } catch (e) {
    box.innerHTML = `<span class="bad">${t("sp_err")}${esc(e.message)}</span>`;
  } finally { btn.disabled = false; btn.textContent = t("sp_btn"); }
}

function spellApply(cardEl, key, newText) {
  const ta = cardEl.querySelector(`textarea[data-k="${key}"]`);
  ta.value = newText;
  ta.dispatchEvent(new Event("change", { bubbles: true })); // dispara el autoguardado en Monday
  spellRun(cardEl, key); // vuelve a revisar el texto corregido
}

document.addEventListener("click", ev => {
  const b = ev.target.closest && ev.target.closest("button");
  const cardEl = b && b.closest(".card");
  if (!cardEl) return;
  if (b.dataset.chk) return spellRun(cardEl, b.dataset.chk);
  const box = b.closest("[data-sp]");
  if (!box || !(b.dataset.ap || b.dataset.apall)) return;
  const key = box.dataset.sp, { text, matches } = SP[cardEl.dataset.id + "|" + key];
  if (b.dataset.apall) {
    let out = text, limit = Infinity; // de atrás hacia adelante, sin traslapes
    [...matches].filter(m => m.replacements.length).sort((a, c) => c.offset - a.offset).forEach(m => {
      if (m.offset + m.length > limit) return;
      out = out.slice(0, m.offset) + m.replacements[0].value + out.slice(m.offset + m.length);
      limit = m.offset;
    });
    spellApply(cardEl, key, out);
  } else {
    const m = matches[+b.dataset.ap], r = m.replacements[+b.dataset.r].value;
    spellApply(cardEl, key, text.slice(0, m.offset) + r + text.slice(m.offset + m.length));
  }
});

// ── Redacción asistida con IA ────────────────────────────────────────────────
// No hay API: se copia un prompt armado al portapapeles y, según el asistente elegido, se abre su página.
// "copy" (por defecto) no abre nada, así funciona para quien no tenga acceso a ICA u otro servicio.
const ICA_URL = "https://us.ica.ibm.com/ica/assistant-library/detail/821c6a52-67ac-4553-b401-25800b1c9a82?type=ASSISTANT";
const COPILOT_URL = "https://copilot.microsoft.com/";
const aiChoice = () => {
  const v = localStorage.getItem("bmr_ai");
  return ["copy", "ica", "copilot", "custom"].includes(v) ? v : "copy";
};
const aiUrl = () => {
  const v = aiChoice();
  if (v === "ica") return ICA_URL;
  if (v === "copilot") return COPILOT_URL;
  if (v === "custom") {
    const u = (localStorage.getItem("bmr_ai_url") || "").trim();
    return /^https?:\/\//i.test(u) ? u : "";
  }
  return "";
};

function toast(msg) {
  document.querySelectorAll(".toast").forEach(n => n.remove());
  const d = document.createElement("div"); d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 7000);
}

async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) { /* intenta el método clásico */ }
  const ta = document.createElement("textarea"); ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove(); return ok;
}

function aiPrompt(f, area, mes, notes) {
  return LANG === "en"
    ? `Act as an executive writer. Write the "${f.label}" section of the monthly BMR (Business Monthly Review) report for the area "${area}", month ${mes || "-"}.\nUse a clear, concise executive tone, in short bullet points, in English. Do not invent figures or facts: use only the notes below.\n\nNotes:\n${notes}`
    : `Actúa como redactor ejecutivo. Redacta la sección "${f.label}" del reporte mensual BMR (Business Monthly Review) del área "${area}", mes ${mes || "-"}.\nUsa un tono ejecutivo, claro y conciso, en viñetas cortas, en español. No inventes cifras ni hechos: usa solo las notas siguientes.\n\nNotas:\n${notes}`;
}

// ── Gráficas (lámina 2) ──────────────────────────────────────────────────────
const ST = ["Done", "Working on it", "Stuck"];
const ST_COL = { "Done": "198038", "Working on it": "F1A52B", "Stuck": "DA1E28" };
const stOf = i => ST.includes(i.status) ? i.status : "Working on it";

// Fuente única de datos: la usan el SVG de pantalla y las gráficas nativas del PowerPoint
function chartSpecs() {
  const vis = visibles();
  const cnt = (arr, s) => arr.filter(i => stOf(i) === s).length;
  const stack = (title, labels, sets) => ({
    title, type: "stack", labels,
    series: ST.map(s => ({ name: s, color: ST_COL[s], values: sets.map(a => cnt(a, s)) }))
  });
  const grps = state.groups.filter(g => vis.some(i => i.gid === g.id));
  const specs = [
    stack(t("ch_front"), grps.map(g => cleanGroup(g.title)), grps.map(g => vis.filter(i => i.gid === g.id))),
    { title: t("ch_dist"), type: "donut", labels: ST, colors: ST.map(s => ST_COL[s]),
      series: [{ name: t("areas"), values: ST.map(s => cnt(vis, s)) }] },
    { title: t("ch_fields"), type: "hbar", max: 100, fmt: "%", colors: ["0F62FE"],
      labels: FIELDS.map(f => f.label),
      series: [{ name: "%", values: FIELDS.map(f => vis.length ? Math.round(vis.filter(i => i[f.key].trim()).length / vis.length * 100) : 0) }] }
  ];
  // Si el tablero tiene columnas numéricas, la primera se grafica por área
  const numCol = vis.flatMap(i => Object.keys(i.nums))[0];
  if (numCol) {
    const rows = vis.filter(i => numCol in i.nums);
    specs.push({ title: numCol, type: "hbar", colors: ["7C5CD8"], labels: rows.map(i => tx(i.name)),
      series: [{ name: numCol, values: rows.map(i => i.nums[numCol]) }] });
  } else {
    const meses = [...new Set(state.items.map(i => i.mes).filter(Boolean))].sort((a, b) => MESES.indexOf(a) - MESES.indexOf(b));
    specs.push(stack(t("ch_month"), meses.map(fm), meses.map(m => state.items.filter(i => i.mes === m))));
  }
  return specs;
}

function svgChart(sp) {
  const W = 600, H = 235;
  const txt = (x, y, s, o = "") => `<text x="${x}" y="${y}" font-size="${o.includes("big") ? 24 : 12}" fill="${o.includes("w") ? "#fff" : "#1f2328"}" ${o.includes("mid") ? 'text-anchor="middle"' : o.includes("end") ? 'text-anchor="end"' : ""} ${o.includes("b") ? 'font-weight="700"' : ""}>${esc(s)}</text>`;
  const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
  let g = "";
  const total = sp.series.reduce((a, s) => a + s.values.reduce((x, y) => x + y, 0), 0);
  if (!sp.labels.length || !total) g = txt(W / 2, H / 2, I18N[LANG].nodata_m, "mid");
  else if (sp.type === "donut") {
    const rm = 66, sw = 34, C = 2 * Math.PI * rm, vals = sp.series[0].values, tot = vals.reduce((a, b) => a + b, 0);
    let off = 0;
    g += vals.map((v, k) => {
      const len = v / tot * C, el = v ? `<circle cx="170" cy="118" r="${rm}" fill="none" stroke="#${sp.colors[k]}" stroke-width="${sw}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 170 118)"/>` : "";
      off += len; return el;
    }).join("");
    g += txt(170, 128, String(tot), "big mid b");
    g += sp.labels.map((l, k) => `<rect x="320" y="${78 + k * 30}" width="14" height="14" fill="#${sp.colors[k]}"/>` + txt(342, 90 + k * 30, `${l}: ${vals[k]} (${Math.round(vals[k] / tot * 100)}%)`)).join("");
  } else if (sp.type === "stack") {
    const L = 36, R = 12, T = 34, B = 30, n = sp.labels.length, band = (W - L - R) / n, bw = Math.min(80, band * 0.55);
    const tots = sp.labels.map((_, k) => sp.series.reduce((a, s) => a + s.values[k], 0));
    const mx = Math.max(1, ...tots), ys = v => H - B - v / mx * (H - B - T);
    const step = Math.max(1, Math.ceil(mx / 4)); // eje en enteros: son conteos de áreas
    for (let v = 0; v <= mx; v += step) { g += `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="#e5e7eb"/>` + txt(L - 6, ys(v) + 4, String(v), "end"); }
    sp.labels.forEach((l, k) => {
      const x = L + band * k + (band - bw) / 2; let acc = 0;
      sp.series.forEach(s => {
        const v = s.values[k]; if (!v) return;
        const y1 = ys(acc + v), h = ys(acc) - y1; acc += v;
        g += `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="#${s.color}"/>` + (h > 15 ? txt(x + bw / 2, y1 + h / 2 + 4, String(v), "mid w b") : "");
      });
      g += txt(x + bw / 2, H - 10, cut(l, 18), "mid");
    });
    g += sp.series.map((s, k) => `<rect x="${L + k * 130}" y="8" width="12" height="12" fill="#${s.color}"/>` + txt(L + k * 130 + 17, 19, s.name)).join("");
  } else { // hbar
    const L = 150, R = 44, n = sp.labels.length, rh = (H - 12) / n, bh = Math.min(22, rh * 0.62), vals = sp.series[0].values;
    const mx = sp.max || Math.max(1, ...vals);
    sp.labels.forEach((l, k) => {
      const y = 6 + rh * k + (rh - bh) / 2, w = vals[k] / mx * (W - L - R);
      g += txt(L - 8, y + bh / 2 + 4, cut(l, 24), "end") + `<rect x="${L}" y="${y}" width="${w}" height="${bh}" fill="#${sp.colors[0]}"/>` + txt(L + w + 5, y + bh / 2 + 4, vals[k] + (sp.fmt || ""), "b");
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" font-family="Segoe UI, system-ui, sans-serif">${g}</svg>`;
}

function kpiList() {
  const vis = visibles(), c = s => vis.filter(i => stOf(i) === s).length;
  const filled = vis.filter(i => FIELDS.every(f => i[f.key].trim())).length;
  return [[vis.length, t("kpi_areas")], [c("Done"), "Done"], [c("Working on it"), "Working on it"], [c("Stuck"), "Stuck"],
          [(vis.length ? Math.round(filled / vis.length * 100) : 0) + "%", t("kpi_filled")]];
}

function renderCharts() {
  const mes = mesLabel();
  $("slide2").innerHTML = `
    <div class="top"><h2>${t("ind")}</h2><span>${esc(mes)} · ${esc(state.boardName)}</span>${logosHtml()}</div>
    <div class="kp">${kpiList().map(k => `<div><b>${k[0]}</b><span>${k[1]}</span></div>`).join("")}</div>
    <div class="charts">${chartSpecs().map(sp => `<div class="cp"><h5>${esc(sp.title)}</h5>${svgChart(sp)}</div>`).join("")}</div>`;
}

// Una sola letra para las 4 columnas: la más pequeña que permita que todas quepan
let fitSize = 17;
function fitSlide() {
  const bodies = [...document.querySelectorAll(".sbody")];
  let s = 17;
  const overflow = () => bodies.some(b => b.scrollHeight > b.clientHeight + 1);
  bodies.forEach(b => b.style.fontSize = s + "px");
  while (overflow() && s > 8) { s -= 0.5; bodies.forEach(b => b.style.fontSize = s + "px"); }
  fitSize = s;
}
function scaleSlide() {
  document.querySelectorAll(".slide-wrap").forEach(w => {
    const k = Math.min(1, w.clientWidth / 1280);
    w.firstElementChild.style.transform = `scale(${k})`;
    w.style.height = (720 * k + 2) + "px";
  });
}
window.addEventListener("resize", () => { if (view === "slide") scaleSlide(); });

function pptLogos(sl) {
  sl.addImage({ data: LOGO_IBM.replace("data:", ""), x: 10.64, y: 0.17, w: 0.87, h: 0.36 });
  sl.addImage({ data: LOGO_CEMEX.replace("data:", ""), x: 11.71, y: 0.2, w: 1.22, h: 0.3 });
}

async function exportPptx() {
  await prepTranslations(visibles().flatMap(i => [i.name, ...FIELDS.flatMap(f => i[f.key].split(/\r?\n/).map(s => s.trim()))]));
  const P = new PptxGenJS();
  P.layout = "LAYOUT_WIDE"; // 13.33 x 7.5 in
  const s = P.addSlide();
  const mes = mesLabel();
  s.addText("BMR · Business Monthly Review", { x: 0.4, y: 0.15, w: 8, h: 0.5, fontSize: 24, bold: true, color: "0B2A4A" });
  s.addText(`${mes} · ${state.boardName}`, { x: 6.2, y: 0.2, w: 4.3, h: 0.4, fontSize: 13, color: "57606A", align: "right" });
  pptLogos(s);
  const colW = 3.1, x0 = 0.4, gap = 0.1;
  FIELDS.forEach((f, idx) => {
    const x = x0 + idx * (colW + gap);
    s.addShape(P.ShapeType.rect, { x, y: 0.8, w: colW, h: 0.45, fill: { color: "0B2A4A" } });
    s.addText(`${f.n}  ${f.label}`, { x: x + 0.1, y: 0.8, w: colW - 0.2, h: 0.45, fontSize: 14, bold: true, color: "FFFFFF" });
    const runs = [];
    colData(f).forEach(g => {
      runs.push({ text: g.group.toUpperCase(), options: { bold: true, color: "0F62FE", breakLine: true } });
      g.items.forEach(i => {
        runs.push({ text: i.name, options: { bold: true, color: "1F2328", breakLine: true } });
        i.lines.forEach(l => runs.push({ text: l, options: { color: "1F2328", breakLine: true } }));
      });
    });
    if (!runs.length) runs.push({ text: t("noinfo"), options: { color: "8D949C" } });
    const pt = Math.max(7, Math.round(fitSize * 0.75 * 10) / 10);
    s.addText(runs, { x, y: 1.3, w: colW, h: 6.0, valign: "top", fontSize: pt, fit: "shrink", margin: 4, line: { color: "E5E7EB", width: 0.75 } });
  });
  // Lámina 2: indicadores con gráficas nativas (editables en PowerPoint)
  const s2 = P.addSlide();
  s2.addText(t("ind"), { x: 0.4, y: 0.15, w: 8, h: 0.5, fontSize: 24, bold: true, color: "0B2A4A" });
  s2.addText(`${mes} · ${state.boardName}`, { x: 6.2, y: 0.2, w: 4.3, h: 0.4, fontSize: 13, color: "57606A", align: "right" });
  pptLogos(s2);
  kpiList().forEach((k, n) => {
    const x = 0.4 + n * 2.5;
    s2.addShape(P.ShapeType.rect, { x, y: 0.8, w: 2.4, h: 0.85, fill: { color: "F7F8FA" }, line: { color: "E5E7EB", width: 0.75 } });
    s2.addText(String(k[0]), { x: x + 0.1, y: 0.82, w: 2.2, h: 0.5, fontSize: 24, bold: true, color: "0B2A4A" });
    s2.addText(k[1], { x: x + 0.1, y: 1.3, w: 2.2, h: 0.3, fontSize: 10, color: "57606A" });
  });
  chartSpecs().forEach((sp, n) => {
    const pos = { x: 0.4 + (n % 2) * 6.4, y: 1.8 + Math.floor(n / 2) * 2.8, w: 6.1, h: 2.7 };
    const base = { ...pos, showTitle: true, title: sp.title, titleFontSize: 13, titleColor: "0B2A4A", dataLabelFontSize: 10, catAxisLabelFontSize: 10, valAxisLabelFontSize: 9 };
    if (!sp.labels.length || !sp.series.some(se => se.values.some(v => v))) {
      s2.addText(`${sp.title}: ${t("nodata_p")}`, { ...pos, align: "center", fontSize: 12, color: "8D949C", line: { color: "E5E7EB", width: 0.75 } });
    } else if (sp.type === "donut") {
      s2.addChart(P.charts.DOUGHNUT, [{ name: sp.series[0].name, labels: sp.labels, values: sp.series[0].values }],
        { ...base, chartColors: sp.colors, holeSize: 55, showLegend: true, legendPos: "r", legendFontSize: 10, showValue: true, showPercent: false, dataLabelColor: "FFFFFF", dataLabelFormatCode: "0;;;" });
    } else if (sp.type === "stack") {
      s2.addChart(P.charts.BAR, sp.series.map(se => ({ name: se.name, labels: sp.labels, values: se.values })),
        { ...base, barDir: "col", barGrouping: "stacked", chartColors: sp.series.map(se => se.color), showLegend: true, legendPos: "t", legendFontSize: 10, showValue: true, dataLabelColor: "FFFFFF", dataLabelFormatCode: "0;;;" });
    } else {
      s2.addChart(P.charts.BAR, [{ name: sp.series[0].name, labels: sp.labels, values: sp.series[0].values }],
        { ...base, barDir: "bar", catAxisOrientation: "maxMin", chartColors: sp.colors, showLegend: false, showValue: true, dataLabelColor: "1F2328", ...(sp.max ? { valAxisMaxVal: sp.max } : {}) });
    }
  });
  P.writeFile({ fileName: `BMR_${mes.replace(/\s+/g, "_")}.pptx` });
}

function applyLang() {
  updateTrBtn(false);
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $("b-lang").textContent = LANG === "es" ? "EN" : "ES"; // muestra el idioma al que se cambia
  if (state.boardName) $("board-name").textContent = t("board") + state.boardName;
  paintStatus();
  if (state.items.length) { buildMonthFilter(); render(); }
}
$("b-lang").onclick = () => {
  LANG = LANG === "es" ? "en" : "es";
  localStorage.setItem("bmr_lang", LANG);
  applyLang();
};
$("b-refresh").onclick = () => view === "meet" ? meetLoad(false) : load(false);
$("b-cfg").onclick = showConfig;
$("b-pptx").onclick = exportPptx;
$("b-print").onclick = () => window.print();
$("b-tr").onclick = async () => {
  const [s, g] = trPair();
  toast(t("tr_prep"));
  const det = getDetector(); // opcional; se lanza a la vez, dentro del permiso del clic
  const tr = await getTranslator(s, g);
  await det;
  document.querySelectorAll(".toast").forEach(n => n.remove());
  if (!tr) return toast(t("tr_fail"));
  Object.keys(TR_CACHE).forEach(k => delete TR_CACHE[k]); // descarta lo procesado sin traductor
  updateTrBtn(false);
  render();
};
$("c-ai").onchange = syncAiFields;
$("c-save").onclick = () => {
  const t = $("c-token").value.trim();
  if (t) localStorage.setItem("bmr_token", t);
  localStorage.setItem("bmr_board", $("c-board").value.trim() || DEFAULT_BOARD);
  localStorage.setItem("bmr_meet", $("c-meet").value.trim());
  meet.loaded = false; meet.sig = ""; meet.histLoaded = false;
  localStorage.setItem("bmr_lt", $("c-lt").value.trim());
  localStorage.setItem("bmr_ai", $("c-ai").value);
  localStorage.setItem("bmr_ai_url", $("c-ai-url").value.trim());
  $("c-token").value = "";
  load(false);
};

// Actualización en línea: relee Monday cada 60 s si nadie está escribiendo
setInterval(() => {
  const a = document.activeElement;
  if (pending || (a && a.closest && a.closest(".card, .mcard, .mbar"))) return;
  if (view === "meet") meetLoad(true); else { load(true); if (token()) meetLoad(true); }
}, 60000);

document.body.insertAdjacentHTML("beforeend", `<datalist id="meses">${MESES.map(m => `<option value="${m}">`).join("")}</datalist>`);
applyLang();
load(false);
if (token()) meetLoad(true); // carga en segundo plano para mostrar la insignia de alertas
